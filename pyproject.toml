[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "antipode-audio"
version = "0.1.1"
description = "Local sound creation for AI coding agents."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = ["mcp>=2,<3", "numpy>=2,<3"]

[project.urls]
Source = "https://github.com/mchl-schrdng/antipode-audio"
Issues = "https://github.com/mchl-schrdng/antipode-audio/issues"

[project.scripts]
antipode = "antipode.cli:main"
antipode-mcp = "antipode.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/antipode"]

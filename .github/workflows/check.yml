name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.12'
          - os: macos-latest
            python: '3.12'
          - os: windows-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - name: Enforce solo-maintainer pull request policy
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'mchl-schrdng'
        run: |
          echo "::error::External pull requests are not accepted (see CONTRIBUTING.md). Please open an Issue instead."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uv python install 3.12
      - run: uv run --locked --python 3.12 scripts/claude_mcp.py --help
      - run: uv run --frozen --python ${{ matrix.python }} python -m unittest discover -s tests -v
      - run: uv build
      - run: uv run --frozen --python ${{ matrix.python }} python scripts/build_plugin.py
      - run: uv run --frozen --python ${{ matrix.python }} python scripts/build_plugin.py --client antigravity
      - run: uv run --frozen --python ${{ matrix.python }} python scripts/check_distribution.py
